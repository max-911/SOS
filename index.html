<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Library</title></head><body><header><h1>📚 SOS Library</h1><div>Temple Book Inventory</div></header><main class="wrap">
<section id="home"><div class="card stats"><div><b id="titles">0</b>Titles</div><div><b id="copies">0</b>Books</div><div><b id="languages">0</b>Languages</div></div><div class="card"><div class="scanBtns"><button class="primary" onclick="scanBarcode(false)">📷 Scan Barcode</button><button class="primary" onclick="tagCapture(false)">🏷 Scan Book Tag</button><button class="secondary" onclick="openForm()">✏️ Add Manually</button></div><button class="secondary" style="width:100%;margin-top:9px" onclick="openInventory()">📋 Year-End Inventory</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search title, ID, ISBN..." oninput="render()"><select id="lang" onchange="render()"><option value="">All languages</option></select><select id="catFilter" onchange="render()"><option value="">All categories</option></select></div><div id="list"></div></div><div class="card"><div class="grid"><button class="secondary" onclick="exportBooks()">Export CSV</button><button class="secondary" onclick="backup()">Backup JSON</button></div></div></section>
<section id="scanner" class="hidden"><div class="card"><h2 id="scanTitle">Scan</h2><video id="video" playsinline autoplay></video><canvas id="canvas" class="hidden"></canvas><div id="scanStatus" class="status">Starting camera…</div><div class="grid"><button class="secondary" onclick="stopCamera()">Cancel</button><button id="captureBtn" class="primary hidden" onclick="captureTag()">Capture Tag</button></div></div></section>
<section id="form" class="hidden"><div class="card"><h2 id="formHeading">Book details</h2><input id="rowId" type="hidden"><div class="grid"><div><label>ISBN</label><input id="isbn" inputmode="numeric"></div><button class="secondary" style="align-self:end" onclick="lookup()">Lookup ISBN</button></div><div id="lookupStatus" class="note"></div><label>Catalog ID</label><input id="catalogId" oninput="deriveLanguage()"><div class="note">Language: <b id="derivedLanguage">Not determined</b></div><label>Title *</label><input id="title"><div class="grid"><div><label>Category</label><select id="category"></select></div><div><label>Price</label><input id="price"></div></div><div class="grid"><div><label>Current quantity</label><input id="current" type="number"></div><div><label>Shelf / location</label><input id="location"></div></div><div class="grid"><div><label>Author</label><input id="author"></div><div><label>Publisher</label><input id="publisher"></div></div><label>Notes</label><textarea id="notes"></textarea><div class="grid"><button class="secondary" onclick="show('home')">Cancel</button><button class="primary" onclick="saveBook()">Save</button></div></div></section>
<section id="inventory" class="hidden"><div class="card"><h2>Year-End Inventory</h2><div class="grid"><input id="invName" placeholder="Inventory name, e.g. 2026"><button class="secondary" onclick="newSession()">Start / Reset</button></div><div class="scanBtns"><button class="primary" onclick="scanBarcode(true)">📷 Scan Barcode</button><button class="primary" onclick="tagCapture(true)">🏷 Scan Tag</button><button class="secondary" onclick="manualCount()">🔎 Find Manually</button></div><div class="grid3" style="margin-top:12px"><div>Expected<br><b id="invExpected">0</b></div><div>Counted<br><b id="invCounted">0</b></div><div>Difference<br><b id="invDiff">0</b></div></div><div id="lastScan" class="status">Ready to count.</div><div class="grid"><button class="secondary" onclick="undoScan()">↶ Undo Last</button><button class="secondary" onclick="downloadReconciliation()">Download CSV</button></div><input id="reconSearch" placeholder="Filter reconciliation..." oninput="renderReconciliation()" style="margin-top:10px"><div id="recon"></div><div class="grid"><button class="secondary" onclick="show('home')">Back</button><button class="danger" onclick="applyCounts()">Approve & Apply Counts</button></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
