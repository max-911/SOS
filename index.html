<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Irvine</title></head><body><header><h1>📚 SOS Library</h1><div>Irvine Inventory</div></header><main class="wrap"><section id="home"><div class="card actions"><button class="primary" onclick="scanBarcode()">📷 Scan Barcode</button><button class="primary" onclick="scanTag()">🏷 Scan Book Tag</button><button class="secondary" onclick="addManual()">✏️ Add Manually</button><button class="secondary" onclick="alert('Year-End Inventory retained for next patch')">📋 Year-End Inventory</button><button class="success">🛒 Sale</button><button class="success">📦 Receipt</button><button class="secondary">↩ Return</button><button class="secondary">🧾 History</button></div><div class="card"><input id="q" placeholder="Search books, photos, devices, IDs..." oninput="render()"><div id="summary"></div><div id="list"></div></div></section><section id="scanner" class="hidden"><div class="card"><h2 id="st"></h2><video id="video" playsinline autoplay></video><canvas id="canvas" class="hidden"></canvas><div id="ss" class="status"></div><div class="grid"><button class="secondary" onclick="stop()">Cancel</button><button id="cap" class="primary hidden" onclick="capture()">Capture Tag</button></div></div></section><div style="text-align:center;color:#667085;font-size:12px">SOS Irvine Version 8.0 • Build 2026-11-14</div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
