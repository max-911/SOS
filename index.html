<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Irvine</title></head><body><header><h1>📚 SOS Library</h1><div>Irvine Inventory</div></header><main class="wrap">
<section id="home"><div class="card stats"><div><b id="itemCount">0</b>Items</div><div><b id="stockCount">0</b>In stock</div><div><b id="txCount">0</b>Transactions</div><div><b id="saleTotal">$0</b>Sales</div></div><div class="card actions"><button class="primary" onclick="scanBarcode('lookup')">📷 Scan Barcode</button><button class="primary" onclick="scanTag('lookup')">🏷 Scan Tag</button><button class="secondary" onclick="editItem()">✏️ Add Manually</button><button class="secondary" onclick="openInventory()">📋 Year-End Inventory</button><button class="success" onclick="openTx('SALE')">🛒 Sale</button><button class="success" onclick="openTx('RECEIPT')">📦 Receipt</button><button class="secondary" onclick="openTx('RETURN')">↩ Return</button><button class="secondary" onclick="openHistory()">🧾 History</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search title, ID, ISBN..." oninput="render()"><select id="typeFilter" onchange="render()"><option value="">All types</option><option>Book</option><option>Photo</option><option>Device</option></select></div><div id="typeSummary" class="status"></div><div id="list"></div></div><div class="card actions"><button class="secondary" onclick="exportInventory()">Inventory CSV</button><button class="secondary" onclick="backup()">Complete Backup</button><label class="filebtn secondary">Restore Backup<input id="restoreFile" class="hidden" type="file" accept=".json" onchange="restoreBackup(this)"></label><button class="secondary" onclick="reloadMaster()">Reload Master</button></div></section>
<section id="scanner" class="hidden"><div class="card"><h2 id="scanTitle"></h2><video id="video" playsinline autoplay></video><canvas id="canvas" class="hidden"></canvas><div id="scanStatus" class="status"></div><div class="grid"><button class="secondary" onclick="stopCamera()">Cancel</button><button id="captureBtn" class="primary hidden" onclick="captureTag()">Capture Tag</button></div></div></section>
<section id="editor" class="hidden"><div class="card"><h2>Item Details</h2><input id="eUid" type="hidden"><div class="grid"><div><label>ID</label><input id="eId" oninput="deriveLanguage()"></div><div><label>Type</label><select id="eType"><option>Book</option><option>Photo</option><option>Device</option></select></div></div><label>Title</label><input id="eTitle"><div class="grid"><div><label>Current</label><input id="eCurrent" type="number"></div><div><label>Price</label><input id="ePrice"></div></div><div class="grid"><div><label>Language</label><input id="eLanguage"></div><div><label>Category</label><select id="eCategory"></select></div></div><label>ISBN aliases</label><div id="isbnList"></div><div class="grid"><input id="newIsbn" inputmode="numeric" placeholder="New ISBN"><button class="secondary" onclick="addIsbn()">Add ISBN</button></div><label>Notes</label><textarea id="eNotes"></textarea><div class="grid"><button class="secondary" onclick="show('home')">Cancel</button><button class="primary" onclick="saveItem()">Save Item</button></div></div></section>
<section id="unknown" class="hidden"><div class="card"><h2>Unknown ISBN</h2><div class="status">ISBN <b id="unknownCode"></b> was not found.</div><div class="actions"><button class="primary" onclick="scanTag('unknown')">🏷 Scan Tag & Save ISBN</button><button class="secondary" onclick="unknownSearch()">Search ID/Title</button><button class="secondary" onclick="editItem(null,true)">Add Manually</button><button class="secondary" onclick="show('home')">Cancel</button></div></div></section>
<section id="transaction" class="hidden"><div class="card"><h2 id="txHeading"></h2><div class="actions"><button class="primary" onclick="scanBarcode('transaction')">📷 Barcode</button><button class="primary" onclick="scanTag('transaction')">🏷 Tag</button><button class="secondary" onclick="manualTx()">Add ID</button><button class="secondary" onclick="show('batch')">📋 ID + Qty List</button></div><div id="cart"></div><div class="status">Items: <b id="cartQty">0</b> • Total: <b id="cartTotal">$0.00</b></div><label>Note</label><input id="txNote"><div class="grid"><button class="secondary" onclick="show('home')">Cancel</button><button class="success" onclick="completeTx()">Complete Transaction</button></div></div></section>
<section id="batch" class="hidden"><div class="card"><h2>ID + Quantity List</h2><textarea id="batchText" rows="12" placeholder="EN-302-0 2&#10;PH-700-3 x1&#10;WTD-001 3"></textarea><div class="actions"><button class="primary" onclick="document.getElementById('batchPhoto').click()">📷 Scan List</button><button class="secondary" onclick="parseBatch()">Add to Transaction</button><button class="secondary" onclick="show('transaction')">Back</button></div><input id="batchPhoto" class="hidden" type="file" accept="image/*" capture="environment" onchange="ocrBatch(this)"><div id="batchStatus" class="status"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Transaction History</h2><div class="actions"><select id="historyType" onchange="renderHistory()"><option value="">All types</option><option>SALE</option><option>RECEIPT</option><option>RETURN</option><option>ADJUSTMENT</option></select><button class="secondary" onclick="exportHistory()">Download CSV</button><button class="secondary" onclick="show('home')">Back</button></div><div id="historyList"></div></div></section>
<section id="inventory" class="hidden"><div class="card"><h2>Year-End Inventory</h2><div class="grid"><input id="inventoryName" placeholder="e.g. 2026"><button class="danger" onclick="resetInventory()">Start / Reset</button></div><div class="actions"><button class="primary" onclick="scanBarcode('inventory')">📷 Barcode</button><button class="primary" onclick="scanTag('inventory')">🏷 Tag</button><button class="secondary" onclick="manualCount()">Add ID</button><button class="secondary" onclick="undoCount()">Undo</button></div><div id="inventoryStatus" class="status">Ready.</div><div class="actions"><button class="secondary" onclick="downloadRecon()">Reconciliation CSV</button><button class="danger" onclick="applyCounts()">Approve & Apply</button><button class="secondary" onclick="show('home')">Back</button></div><input id="reconSearch" placeholder="Filter reconciliation..." oninput="renderRecon()"><div id="recon"></div></div></section>
<div class="version">SOS Irvine Version 10.0 • Barcode Compatibility Build 2026-11-19</div></main><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app-v10.js"></script></body></html>
