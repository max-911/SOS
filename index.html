<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Irvine Inventory</title></head><body><header><h1>📚 SOS Library</h1><div>Irvine Inventory</div></header><main class="wrap">
<section id="home"><div class="card stats"><div><b id="titles">0</b>Items</div><div><b id="copies">0</b>In stock</div><div><b id="txcount">0</b>Transactions</div><div><b id="sales">$0</b>Sales</div></div><div class="card actions"><button class="primary" onclick="scanBarcode('lookup')">📷 Scan Barcode</button><button class="primary" onclick="scanTag('lookup')">🏷 Scan Book Tag</button><button class="secondary" onclick="manualAdd()">✏️ Add Manually</button><button class="secondary" onclick="openInventory()">📋 Year-End Inventory</button><button class="success" onclick="openTx('SALE')">🛒 Sale</button><button class="success" onclick="openTx('RECEIPT')">📦 Receipt</button><button class="secondary" onclick="openTx('RETURN')">↩ Return</button><button class="secondary" onclick="openHistory()">🧾 History</button></div><div class="card"><input id="search" placeholder="Search ID, title, ISBN..." oninput="render()"><div id="list"></div></div><div class="card grid"><button class="secondary" onclick="backup()">Complete Backup</button><button class="secondary" onclick="exportInventory()">Inventory CSV</button></div></section>
<section id="scanner" class="hidden"><div class="card"><h2 id="scanTitle"></h2><video id="video" playsinline autoplay></video><canvas id="canvas" class="hidden"></canvas><div id="scanStatus" class="status"></div><div class="grid"><button class="secondary" onclick="stopCamera()">Cancel</button><button id="capture" class="primary hidden" onclick="captureTag()">Capture Tag</button></div></div></section>
<section id="edit" class="hidden"><div class="card"><h2>Item</h2><input id="editUid" type="hidden"><label>ID</label><input id="editId"><label>Title</label><input id="editTitle"><div class="grid"><div><label>Type</label><select id="editType"><option>Book</option><option>Photo</option><option>Device</option></select></div><div><label>Current</label><input id="editCurrent" type="number"></div></div><label>ISBN aliases (one per line)</label><textarea id="editIsbns" rows="4"></textarea><div class="grid"><button class="secondary" onclick="show('home')">Cancel</button><button class="primary" onclick="saveEdit()">Save</button></div></div></section>
<section id="transaction" class="hidden"><div class="card"><h2 id="txHeading"></h2><div class="actions"><button class="primary" onclick="scanBarcode('transaction')">📷 Barcode</button><button class="primary" onclick="scanTag('transaction')">🏷 Tag</button><button class="secondary" onclick="addById()">Add ID</button><button class="primary" onclick="openBatch()">📋 ID + Qty List</button></div><div id="cart"></div><label>Note</label><input id="txNote"><div class="grid"><button class="secondary" onclick="show('home')">Cancel</button><button class="success" onclick="completeTx()">Complete</button></div></div></section>
<section id="batch" class="hidden"><div class="card"><h2>IDs and Quantities</h2><textarea id="batchText" rows="12" placeholder="EN-302-0 2&#10;PH-700-3 1"></textarea><div class="actions"><button class="primary" onclick="document.getElementById('listPhoto').click()">📷 Scan List</button><button class="secondary" onclick="parseBatch()">Add to Transaction</button><button class="secondary" onclick="show('transaction')">Back</button></div><input id="listPhoto" class="hidden" type="file" accept="image/*" capture="environment" onchange="ocrList(this)"><div id="batchStatus" class="status"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Transaction History</h2><div class="grid"><button class="secondary" onclick="exportHistory()">Download CSV</button><button class="secondary" onclick="show('home')">Back</button></div><div id="historyList"></div></div></section>
<section id="inventory" class="hidden"><div class="card"><h2>Year-End Inventory</h2><div class="actions"><button class="primary" onclick="scanBarcode('inventory')">📷 Barcode</button><button class="primary" onclick="scanTag('inventory')">🏷 Tag</button><button class="secondary" onclick="manualCount()">Add ID</button><button class="secondary" onclick="show('home')">Back</button></div><div id="invStatus" class="status">Ready.</div></div></section>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
