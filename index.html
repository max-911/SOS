<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><title>SOS Library</title><style>:root{--b:#173f67;--g:#d89b22;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:var(--bg);color:#182230}header{background:var(--b);color:#fff;padding:25px 18px 50px}header h1{margin:0}.wrap{max-width:760px;margin:-30px auto 30px;padding:0 14px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #10182812}.stats{display:grid;grid-template-columns:1fr 1fr;text-align:center}.stats b{display:block;font-size:30px;color:var(--b)}button{border:0;border-radius:12px;padding:13px;font-weight:700}.primary{background:var(--g);width:100%;font-size:17px}.secondary{background:#e9eef4;color:var(--b)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}.hidden{display:none}.book{border-top:1px solid #eee;padding:12px 0}.muted{color:#667085;font-size:13px}video{width:100%;min-height:260px;background:#111;border-radius:12px}#status{padding:10px;background:#fffaeb;border-radius:10px}</style></head><body><header><h1>📚 SOS Library</h1><div>Temple Book Inventory</div></header><main class="wrap"><section id="home"><div class="card stats"><div><b id="tc">0</b>Titles</div><div><b id="bc">0</b>Books</div></div><div class="card"><button class="primary" onclick="scan()">📷 Scan ISBN</button><div class="grid"><button class="secondary" onclick="openForm()">➕ Add Book</button><button class="secondary" onclick="document.querySelector('#search').focus()">🔎 Search</button></div></div><div class="card"><input id="search" placeholder="Search title, author, ISBN..." oninput="render()"><div id="list"></div></div><div class="card"><b>Backup</b><div class="grid"><button class="secondary" onclick="csv()">Export CSV</button><button class="secondary" onclick="backup()">Backup JSON</button></div></div></section><section id="scanner" class="hidden"><div class="card"><h2>Scan ISBN barcode</h2><video id="video" playsinline autoplay></video><p id="status">Starting camera…</p><div class="grid"><button class="secondary" onclick="stop()">Cancel</button><button class="secondary" onclick="stop();openForm()">Enter manually</button></div></div></section><section id="form" class="hidden"><div class="card"><h2>Add Book</h2><input id="id" type="hidden"><label>ISBN</label><div class="grid"><input id="isbn" inputmode="numeric"><button class="secondary" onclick="lookup()">Lookup ISBN</button></div><div id="lookupStatus" class="muted"></div><label>Title *</label><input id="title"><label>Author</label><input id="author"><div class="grid"><div><label>Publisher</label><input id="publisher"></div><div><label>Year</label><input id="year"></div></div><div class="grid"><div><label>Language</label><input id="language"></div><div><label>Category</label><input id="category"></div></div><div class="grid"><div><label>Quantity</label><input id="quantity" type="number" min="1" value="1"></div><div><label>Shelf / Location</label><input id="location"></div></div><label>Donated by</label><input id="donated"><label>Notes</label><textarea id="notes"></textarea><div class="grid"><button class="secondary" onclick="closeForm()">Cancel</button><button class="primary" onclick="save()">Save</button></div></div></section></main><script src="app.js"></script></body></html>
