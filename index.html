<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Library</title></head><body><header><h1>📚 SOS Library</h1><div>Temple Book Inventory</div></header><main class="wrap">
<section id="home"><div class="card stats"><div><b id="titles">0</b>Titles</div><div><b id="copies">0</b>Current books</div><div><b id="languages">0</b>Languages</div></div>
<div class="card"><button class="primary" style="width:100%" onclick="scan()">📷 Scan ISBN</button><div class="grid"><button class="secondary" onclick="openForm()">➕ Add title</button><button class="secondary" onclick="backup()">💾 Backup JSON</button></div></div>
<div class="card"><div class="toolbar"><input id="search" placeholder="Search title, ID, ISBN..." oninput="render()"><select id="lang" onchange="render()"><option value="">All languages</option></select><select id="cat" onchange="render()"><option value="">All categories</option></select></div><div id="list"></div></div>
<div class="card"><b>Data tools</b><div class="grid"><button class="secondary" onclick="csvExport()">Export CSV</button><label class="filebtn secondary">Restore JSON<input class="hidden" type="file" accept="application/json" onchange="restore(this)"></label></div><p class="note">Baseline imported from BAV Irvine 2026. Changes are stored locally on this device.</p></div></section>
<section id="scanner" class="hidden"><div class="card"><h2>Scan ISBN</h2><video id="video" playsinline autoplay></video><div id="status">Starting camera…</div><div class="grid"><button class="secondary" onclick="stopScan()">Cancel</button><button class="secondary" onclick="stopScan(false);openForm()">Enter manually</button></div></div></section>
<section id="form" class="hidden"><div class="card"><h2 id="formHeading">Book details</h2><input id="rowId" type="hidden"><div class="grid"><div><label>ISBN</label><input id="isbn" inputmode="numeric"></div><button class="secondary" style="align-self:end" onclick="lookup()">Lookup</button></div><div id="lookupStatus" class="note">Lookup order: SOS catalog → Open Library → Google Books.</div><label>Catalog ID</label><input id="catalogId"><label>Title *</label><input id="title"><div class="grid"><div><label>Author</label><input id="author"></div><div><label>Language</label><input id="language"></div></div><div class="grid"><div><label>Category</label><input id="category"></div><div><label>Price</label><input id="price"></div></div><div class="grid"><div><label>Current quantity</label><input id="current" type="number"></div><div><label>Shelf / location</label><input id="location"></div></div><div class="grid"><div><label>Publisher</label><input id="publisher"></div><div><label>Published</label><input id="year"></div></div><label>Notes</label><textarea id="notes"></textarea><div class="grid"><button class="secondary" onclick="closeForm()">Cancel</button><button class="primary" onclick="save()">Save</button></div></div></section></main><script src="app.js"></script></body></html>
