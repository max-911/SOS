<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f67"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>SOS Irvine Inventory</title></head><body><header><h1>📚 SOS Library</h1><div>Irvine Inventory</div></header><main class="wrap">
<section id="home"><div class="card stats"><div><b id="titles">0</b>Items</div><div><b id="copies">0</b>In stock</div><div><b id="txcount">0</b>Transactions</div><div><b id="sales">$0</b>Sales</div></div><div class="card actions"><button class="success" onclick="openTx('SALE')">🛒 Sale</button><button class="success" onclick="openTx('RECEIPT')">📦 Receipt</button><button class="secondary" onclick="openTx('RETURN')">↩ Return</button><button class="secondary" onclick="openHistory()">🧾 History</button></div><div class="card"><input id="search" placeholder="Search ID, title, ISBN..." oninput="render()"><div id="list"></div></div><div class="card"><b>Data</b><div class="actions"><label class="filebtn secondary">Import Photos/Devices TXT<input class="hidden" type="file" accept=".txt" onchange="importItems(this)"></label><button class="secondary" onclick="backup()">Complete Backup</button><label class="filebtn secondary">Restore Backup<input class="hidden" type="file" accept=".json" onchange="restore(this)"></label><button class="secondary" onclick="exportInventory()">Inventory CSV</button></div></div></section>
<section id="transaction" class="hidden"><div class="card"><h2 id="txHeading"></h2><div class="actions"><button class="secondary" onclick="addById()">Add ID</button><button class="primary" onclick="openBatch()">📋 Scan/List IDs + Qty</button><button class="secondary" onclick="show('home')">Cancel</button></div><div id="cart"></div><label>Note</label><input id="txNote"><button class="success" style="width:100%;margin-top:10px" onclick="completeTx()">Complete Transaction</button></div></section>
<section id="batch" class="hidden"><div class="card"><h2>IDs and Quantities</h2><p class="meta">Paste or OCR a list. Accepted examples: EN-302-0 2, EN-251-0 x3, or one ID per line.</p><textarea id="batchText" rows="12" placeholder="EN-302-0 2&#10;EN-251-0 x3"></textarea><div class="actions"><button class="primary" onclick="scanListPhoto()">📷 Scan List</button><button class="secondary" onclick="parseBatch()">Add to Transaction</button><button class="secondary" onclick="show('transaction')">Back</button></div><input id="listPhoto" class="hidden" type="file" accept="image/*" capture="environment" onchange="ocrList(this)"><div id="batchStatus" class="status"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Transaction History</h2><div class="actions"><select id="histType" onchange="renderHistory()"><option value="">All</option><option>SALE</option><option>RECEIPT</option><option>RETURN</option><option>ADJUSTMENT</option></select><button class="secondary" onclick="exportHistory()">Download CSV</button><button class="secondary" onclick="show('home')">Back</button></div><div id="historyList"></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
